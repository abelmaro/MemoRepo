version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native compiler without the JavaScript API that astro check and the CBM test oracles use.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line used by CI and the API image.
      - dependency-name: node
        update-types: [version-update:semver-major]
