name: CBM nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target cbm-test -t memorepo-cbm-test -f apps/api/Dockerfile .
      - run: mkdir -p artifacts && sudo chown 1000:1000 artifacts
      - run: docker run --rm -e MEMOREPO_RUN_CBM_CONTRACT=1 memorepo-cbm-test pnpm --filter @memorepo/api test:cbm-contract
      - run: docker run --rm -v "${{ github.workspace }}/artifacts:/artifacts" memorepo-cbm-test pnpm --filter @memorepo/api perf:cbm --output /artifacts/cbm-fast.json --mode fast --warm-repetitions 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cbm-nightly-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
