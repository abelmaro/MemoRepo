name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "feature/**"]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate native Windows CBM isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cbm.zip"
          Invoke-WebRequest "https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.11.0/codebase-memory-mcp-windows-amd64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne "6eb6beaf261b19e419766e78baf93cbc3cf1c6338cff8fb7c0234859f96d1685") { throw "CBM checksum mismatch" }
          $binaryDir = Join-Path $env:RUNNER_TEMP "cbm"
          Expand-Archive $archive -DestinationPath $binaryDir
          $binary = Get-ChildItem $binaryDir -Filter codebase-memory-mcp.exe -Recurse | Select-Object -First 1
          $env:PATH = "$($binary.DirectoryName);$env:PATH"
          $env:MEMOREPO_RUN_CBM_CONTRACT = "1"
          pnpm --filter @memorepo/api test:cbm-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  cbm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target cbm-test -t memorepo-cbm-test -f apps/api/Dockerfile .
      - run: docker run --rm -e MEMOREPO_RUN_CBM_CONTRACT=1 memorepo-cbm-test pnpm --filter @memorepo/api test:cbm-contract
      - run: docker run --rm memorepo-cbm-test pnpm --filter @memorepo/api exec node --import tsx --test test/snapshotSourceTools.test.ts test/cbmBenchmarkCorpus.test.ts
